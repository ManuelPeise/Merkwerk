name: CI

on:
  push:
    branches: [ "Development", "Master", "feature/**", "fix/**", "hotfix/**" ]
  pull_request:
    branches: [ "Development", "Master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore sources/Merkwerk.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build sources/Merkwerk.slnx -c Release --no-restore

      # Unit, architecture and integration tests. Integration tests use Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test sources/Merkwerk.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      # LP-103: the model must match the last migration, and the migration bundle must build.
      - name: Restore dotnet tools (dotnet-ef)
        run: dotnet tool restore

      - name: Check for missing migrations
        env:
          ConnectionStrings__Default: "Server=localhost;Database=ci;User=ci;Password=ci"
        run: dotnet ef migrations has-pending-model-changes -p sources/Data.Database -s sources/Web.Core --no-build -c Release

      - name: Build migration bundle
        env:
          ConnectionStrings__Default: "Server=localhost;Database=ci;User=ci;Password=ci"
        run: dotnet ef migrations bundle -p sources/Data.Database -s sources/Web.Core -c Release -r linux-x64 --self-contained -o artifacts/efbundle --force

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
