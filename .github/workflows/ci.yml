name: CI

on:
  push:
    branches: [ "Development", "Master", "feature/**", "fix/**", "bug/**", "hotfix/**" ]
  pull_request:
    branches: [ "Development", "Master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore sources/Merkwerk.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build sources/Merkwerk.slnx -c Release --no-restore

      # Unit, architecture and integration tests. Integration tests use Testcontainers (Docker is available on ubuntu-latest).
      - name: Test
        run: dotnet test sources/Merkwerk.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      # LP-103: the model must match the last migration, and the migration bundle must build.
      # Note: in `dotnet ef`, -c means --context, so the build configuration is always spelled out.
      - name: Restore dotnet tools (dotnet-ef)
        run: dotnet tool restore

      - name: Check for missing migrations
        env:
          ConnectionStrings__Default: "Server=localhost;Database=ci;User=ci;Password=ci"
        run: dotnet ef migrations has-pending-model-changes -p sources/Data.Database -s sources/Web.Core --no-build --configuration Release

      - name: Build migration bundle
        env:
          ConnectionStrings__Default: "Server=localhost;Database=ci;User=ci;Password=ci"
        run: dotnet ef migrations bundle -p sources/Data.Database -s sources/Web.Core --configuration Release -r linux-x64 --self-contained -o artifacts/efbundle --force

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # LP-163: the React client (lint includes the translation check, see package.json).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sources/Web.Client
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: sources/Web.Client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and translation check
        run: npm run lint

      - name: Build (tsc + Vite)
        run: npm run build
