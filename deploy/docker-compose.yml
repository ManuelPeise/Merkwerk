# Merkwerk – runtime stack (ADR 009)
# Local development:  docker compose -f deploy/docker-compose.yml up -d db
# Raspberry Pi:       docker compose pull && docker compose run --rm migrate && docker compose up -d

name: merkwerk

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    environment:
      MERKWERK_HOST: ${MERKWERK_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  app:
    image: ghcr.io/${GHCR_OWNER}/merkwerk:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Default: "Server=db;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD}"
      Auth__Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Mail (LP-162) – links in mails start with App__PublicBaseUrl
      Mail__Host: ${MAIL_HOST}
      Mail__Port: ${MAIL_PORT:-587}
      Mail__Security: ${MAIL_SECURITY:-StartTls}
      Mail__UserName: ${MAIL_USER}
      Mail__Password: ${MAIL_PASSWORD}
      Mail__FromAddress: ${MAIL_FROM}
      App__PublicBaseUrl: https://${MERKWERK_HOST}
      Media__Path: /data/media
      # Keys for reset/confirmation links (LP-104) – must survive container updates
      DataProtection__KeysPath: /data/keys
    volumes:
      - media:/data/media
      - keys:/data/keys
    depends_on:
      db:
        condition: service_healthy

  # One-shot: applies EF Core migrations (run before starting a new app version)
  migrate:
    image: ghcr.io/${GHCR_OWNER}/merkwerk-migrations:${APP_VERSION:-latest}
    profiles: ["migrate"]
    environment:
      ConnectionStrings__Default: "Server=db;Port=3306;Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  # Development only: HTTPS in front of `dotnet run` (launch profile "lan"), so tablets on the
  # home network can reach the app and install it as a PWA (needs a secure origin).
  #   docker compose -f deploy/docker-compose.yml --profile dev up -d proxy-dev
  proxy-dev:
    image: caddy:2
    profiles: ["dev"]
    ports:
      - "8443:443"
    environment:
      DEV_HOST: ${DEV_HOST:-localhost}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-dev-data:/data

  # Development only: catches every mail, nothing is really sent (LP-162).
  #   UI http://localhost:8025, SMTP localhost:1025
  #   docker compose -f deploy/docker-compose.yml --profile dev up -d mailpit
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-512M}
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Only bound to localhost so the app can reach it during development. Remove on the Pi if not needed.
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  media:
  keys:
  caddy-data:
  caddy-config:
  caddy-dev-data:
