<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dein Startpasswort für Merkwerk</title>
</head>
<body style="margin:0;padding:0;background:#FAF8F4;font-family:'Segoe UI',Arial,sans-serif;color:#1E2328;font-size:16px;line-height:1.5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF8F4;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:2px solid #E3DED5;border-radius:20px;">
        <tr><td style="padding:32px;">
      <p style="font-size:22px;font-weight:700;color:#1F6F78;margin:0 0 16px;">Merkwerk</p>
      <p>Hallo {{Name}},</p>
      <p>dein Startpasswort lautet:</p>
      <p><strong style="font-size:24px;letter-spacing:2px;">{{Code}}</strong></p>
      <p>Es gilt bis {{ExpiresAt}}. Nach der Anmeldung legst du ein eigenes Passwort fest.</p>
      <p>Dein Merkwerk</p>
        </td></tr>
      </table>
      <p style="font-size:12px;color:#5B636B;margin-top:16px;">Diese E-Mail wurde automatisch versendet. Bitte antworte nicht darauf.</p>
    </td></tr>
  </table>
</body>
</html>
