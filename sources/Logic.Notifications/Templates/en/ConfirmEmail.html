<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Please confirm your e-mail address</title>
</head>
<body style="margin:0;padding:0;background:#FAF8F4;font-family:'Segoe UI',Arial,sans-serif;color:#1E2328;font-size:16px;line-height:1.5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF8F4;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:2px solid #E3DED5;border-radius:20px;">
        <tr><td style="padding:32px;">
      <p style="font-size:22px;font-weight:700;color:#1F6F78;margin:0 0 16px;">Merkwerk</p>
      <p>Hello {{Name}},</p>
      <p>please confirm your e-mail address so you can use Merkwerk fully.</p>
      <p style="margin:24px 0;">
        <a href="{{Link}}" style="display:inline-block;background:#1F6F78;color:#FFFFFF;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:12px;">Confirm e-mail address</a>
      </p>
      <p style="font-size:14px;color:#5B636B;">If the button does not work, open this link:<br><a href="{{Link}}" style="color:#1F6F78;word-break:break-all;">{{Link}}</a></p>
      <p>Your Merkwerk</p>
        </td></tr>
      </table>
      <p style="font-size:12px;color:#5B636B;margin-top:16px;">This e-mail was sent automatically. Please do not reply.</p>
    </td></tr>
  </table>
</body>
</html>
